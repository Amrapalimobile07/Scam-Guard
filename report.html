
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Scam - Scam Guard</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #222;
}

.container {
  max-width: 600px;
  margin: 20px auto;
  padding: 25px;
  background: white;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,.10);
}

h1 {
  text-align: center;
  color: #173b75;
}

label {
  display: block;
  margin: 15px 0 6px;
  font-weight: bold;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 14px;
  border: 0;
  border-radius: 8px;
  background: #173b75;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #888;
}

#msg {
  display: none;
  margin-top: 18px;
  padding: 12px;
  border-radius: 8px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

#msg.success {
  display: block;
  background: #e8f7e8;
  color: #176b17;
  border: 1px solid #9bd39b;
}

#msg.error {
  display: block;
  background: #ffeaea;
  color: #a00000;
  border: 1px solid #e0aaaa;
}

.note {
  margin-top: 8px;
  font-size: 13px;
  color: #666;
}
</style>
</head>

<body>

<div class="container">

<h1>🛡️ Report a Scam</h1>

<form id="reportForm">

  <label for="app_name">App Name</label>
  <input
    type="text"
    id="app_name"
    placeholder="उदा. PhonePe"
  >

  <label for="scam_type">Scam Type</label>
  <select id="scam_type">
    <option value="">Select Scam Type</option>
    <option value="UPI Scam">UPI Scam</option>
    <option value="Website Scam">Website Scam</option>
    <option value="Investment Scam">Investment Scam</option>
    <option value="Job Scam">Job Scam</option>
    <option value="Loan Scam">Loan Scam</option>
    <option value="Shopping Scam">Shopping Scam</option>
    <option value="Fake App">Fake App</option>
    <option value="Other">Other</option>
  </select>

  <label for="website_url">Website URL</label>
  <input
    type="url"
    id="website_url"
    placeholder="https://example.com"
  >

  <div class="note">
    अगर scam website है तो उसका पूरा URL डालें।
  </div>

  <label for="upi_id">UPI ID</label>
  <input
    type="text"
    id="upi_id"
    placeholder="example@upi"
  >

  <label for="amount">Amount</label>
  <input
    type="number"
    id="amount"
    placeholder="उदा. 5000"
    min="0"
    step="0.01"
  >

  <label for="description">Description</label>
  <textarea
    id="description"
    placeholder="Scam के बारे में पूरी जानकारी लिखें..."
  ></textarea>

  <button type="submit" id="submitBtn">
    📢 Submit Scam Report
  </button>

</form>

<div id="msg" role="status"></div>

</div>

<script>
"use strict";

/* सही Supabase Project URL */
const SUPABASE_URL =
  "https://zdsvmqtfzprlfsggdepd.supabase.co";

/* Dashboard > Settings > API Keys की Publishable Key */
const SUPABASE_KEY =
  "sb_publishable_ipHcSbMphfOBKG-ijTJDfQ_CSi-ZZZ4";

/* Database table endpoint */
const SUPABASE_ENDPOINT =
  SUPABASE_URL + "/rest/v1/scam_reports";

const form = document.getElementById("reportForm");
const submitBtn = document.getElementById("submitBtn");
const msg = document.getElementById("msg");

function clean(value) {
  return String(value || "").trim();
}

function showMessage(message, type) {
  msg.className = type;
  msg.textContent = message;
  msg.style.display = "block";

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });
}

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  if (submitBtn.disabled) return;

  submitBtn.disabled = true;
  submitBtn.textContent = "⏳ Submitting...";
  msg.style.display = "none";

  try {

    const app_name = clean(
      document.getElementById("app_name").value
    );

    const scam_type = clean(
      document.getElementById("scam_type").value
    );

    const website_url = clean(
      document.getElementById("website_url").value
    );

    const upi_id = clean(
      document.getElementById("upi_id").value
    );

    const amountValue = clean(
      document.getElementById("amount").value
    );

    const description = clean(
      document.getElementById("description").value
    );

    /* कम से कम एक पहचान जरूरी */
    if (!app_name && !website_url && !upi_id) {
      throw new Error(
        "कम से कम App Name, Website URL या UPI ID भरें।"
      );
    }

    /* Website URL जाँच */
    if (website_url) {
      let parsedUrl;

      try {
        parsedUrl = new URL(website_url);
      } catch {
        throw new Error(
          "Website URL सही नहीं है। उदाहरण: https://example.com"
        );
      }

      if (
        parsedUrl.protocol !== "http:" &&
        parsedUrl.protocol !== "https:"
      ) {
        throw new Error("Website URL सही नहीं है।");
      }
    }

    /* Amount जाँच */
    let amount = null;

    if (amountValue !== "") {
      amount = Number(amountValue);

      if (!Number.isFinite(amount) || amount < 0) {
        throw new Error("Amount सही नहीं है।");
      }
    }

    /* Supabase database में भेजने वाला data */
    const report = {
      app_name: app_name || null,
      scam_type: scam_type || null,
      "Website_url": website_url || null,
      "website_url": website_url || null,
      upi_id: upi_id || null,
      amount: amount,
      description: description || null,
      status: "unverified"
    };

    /* Supabase में report भेजें */
    let response;

    try {
      response = await fetch(SUPABASE_ENDPOINT, {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },

        body: JSON.stringify(report)
      });

    } catch (networkError) {
      throw new Error(
        "Supabase connection नहीं बन पाया। Internet और Project URL जाँचें। " +
        networkError.message
      );
    }

    /* Supabase error जाँच */
    if (!response.ok) {
      const errorText = await response.text();

      throw new Error(
        "Supabase Error (" +
        response.status +
        "): " +
        errorText
      );
    }

    /* सफल submission */
    showMessage(
      "✅ Scam Report Successfully Submitted!\n\n" +
      "Status: Unverified\n\n" +
      "Website URL: " +
      (website_url || "Not provided") +
      "\n\nUPI ID: " +
      (upi_id || "Not provided") +
      "\n\nAdmin verification के बाद report public checker में दिखाई देगी।",
      "success"
    );

    form.reset();

  } catch (error) {

    showMessage(
      "❌ Report submit नहीं हुआ।\n\nError: " +
      error.message,
      "error"
    );

  } finally {

    submitBtn.disabled = false;
    submitBtn.textContent = "📢 Submit Scam Report";

  }

});

</script>

</body>
</html>
