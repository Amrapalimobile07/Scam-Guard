<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Report Scam - Scam Guard</title>

<style>
body{margin:0;font-family:Arial;background:#f5f7fb;color:#111827}
.wrap{max-width:700px;margin:auto;padding:18px}
.card{background:white;padding:20px;border-radius:15px;margin-top:20px;box-shadow:0 2px 10px #0001}
h1{text-align:center}
input,select,textarea{
width:100%;box-sizing:border-box;padding:13px;
border:1px solid #ddd;border-radius:10px;
margin:8px 0 14px;font-size:16px
}
button{
padding:13px 18px;border:0;border-radius:10px;
background:#111827;color:white;font-weight:bold;
width:100%;font-size:16px
}
#msg{margin-top:15px;padding:12px;border-radius:10px;display:none}
.green{background:#dcf8df}
.red{background:#ffe0e0}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<h1>🛡️ Report a Scam</h1>

<label>App Name</label>
<input id="app_name" placeholder="Example: PhonePe">

<label>Scam Type</label>
<input id="scam_type" placeholder="Example: Fake Payment">

<label>Website URL</label>
<input id="website_url" placeholder="https://example.com">

<label>UPI ID</label>
<input id="upi_id" placeholder="example@upi">

<label>Amount</label>
<input id="amount" type="number" placeholder="100">

<label>Description</label>
<textarea id="description" rows="5"
placeholder="Scam के बारे में जानकारी लिखें"></textarea>

<button onclick="submitReport()">
📢 Submit Scam Report
</button>

<div id="msg"></div>

</div>

</div>

<script>

const base =
"https://zdsvmqtfzprlfsggdepd.supabase.co";

const key =
"sb_publishable_ipHcSbMphfOBKG-ijTJDfQ_CSi-ZZZ4";

async function submitReport(){

const msg =
document.getElementById("msg");

msg.style.display="block";
msg.className="";
msg.textContent="⏳ Report submit हो रही है...";

const app_name =
document.getElementById("app_name").value.trim();

const scam_type =
document.getElementById("scam_type").value.trim();

const website_url =
document.getElementById("website_url").value.trim();

const upi_id =
document.getElementById("upi_id").value.trim();

const amount =
document.getElementById("amount").value;

const description =
document.getElementById("description").value.trim();


if(!app_name && !website_url && !upi_id){

msg.className="red";
msg.textContent=
"⚠️ App Name, Website या UPI ID में से कम से कम एक भरें।";

return;

}


try{

const response =
await fetch(
base + "/rest/v1/scam_reports",
{
method:"POST",

headers:{
"apikey":key,
"Authorization":"Bearer " + key,
"Content-Type":"application/json",
"Prefer":"return=representation"
},

body:JSON.stringify({

app_name:app_name || null,

scam_type:scam_type || null,

website_url:website_url || null,

upi_id:upi_id || null,

amount:amount ? Number(amount) : null,

description:description || null,

status:"unverified"

})

}
);


const data =
await response.json();


if(!response.ok){

throw new Error(
JSON.stringify(data)
);

}


msg.className="green";

msg.textContent=
"✅ Report successfully submit हो गई। Status: Unverified";


document.getElementById("app_name").value="";
document.getElementById("scam_type").value="";
document.getElementById("website_url").value="";
document.getElementById("upi_id").value="";
document.getElementById("amount").value="";
document.getElementById("description").value="";


}catch(error){

msg.className="red";

msg.textContent=
"❌ Error: " + error.message;

}

}

</script>

</body>
</html>
