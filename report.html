<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Report Scam - Scam Guard</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

.wrap{
  max-width:700px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  padding:20px;
  border-radius:15px;
  margin-top:20px;
  box-shadow:0 2px 10px #0001;
}

h1{
  text-align:center;
}

label{
  display:block;
  font-weight:bold;
  margin-top:10px;
}

input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:8px 0 14px;
  font-size:16px;
  outline:none;
}

button{
  padding:13px 18px;
  border:0;
  border-radius:10px;
  background:#111827;
  color:white;
  font-weight:bold;
  width:100%;
  font-size:16px;
  cursor:pointer;
}

#msg{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  display:none;
  line-height:1.5;
}

.green{
  background:#dcf8df;
}

.red{
  background:#ffe0e0;
}

.yellow{
  background:#fff0b8;
}

.note{
  background:#f3f4f6;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<h1>🛡️ Report a Scam</h1>

<div class="note">
⚠️ केवल suspicious या scam activity की सही जानकारी दें।
</div>


<label for="app_name">
App Name
</label>

<input
  id="app_name"
  type="text"
  placeholder="Example: PhonePe"
  autocomplete="off"
>


<label for="scam_type">
Scam Type
</label>

<input
  id="scam_type"
  type="text"
  placeholder="Example: Fake Payment"
  autocomplete="off"
>


<label for="website_url">
Website URL
</label>

<input
  id="website_url"
  type="url"
  placeholder="https://example.com"
  autocomplete="url"
>


<label for="upi_id">
UPI ID
</label>

<input
  id="upi_id"
  type="text"
  placeholder="example@upi"
  autocomplete="off"
>


<label for="amount">
Amount
</label>

<input
  id="amount"
  type="number"
  min="0"
  step="0.01"
  placeholder="100"
>


<label for="description">
Description
</label>

<textarea
  id="description"
  rows="5"
  placeholder="Scam के बारे में जानकारी लिखें"
></textarea>


<button onclick="submitReport()">
📢 Submit Scam Report
</button>


<div id="msg"></div>

</div>

</div>


<script>

const base =
"https://zdsvmqtfzprlfsggdepd.supabase.co";

const key =
"sb_publishable_ipHcSbMphfOBKG-ijTJDfQ_CSi-ZZZ4";


function clean(value){

  return String(value || "").trim();

}


async function submitReport(){

  const msg =
    document.getElementById("msg");


  msg.style.display="block";

  msg.className="yellow";

  msg.textContent =
    "⏳ Report submit हो रही है...";


  /*
    Form values
  */

  const app_name =
    clean(
      document.getElementById("app_name").value
    );


  const scam_type =
    clean(
      document.getElementById("scam_type").value
    );


  const website_url =
    clean(
      document.getElementById("website_url").value
    );


  const upi_id =
    clean(
      document.getElementById("upi_id").value
    );


  const amountValue =
    clean(
      document.getElementById("amount").value
    );


  const description =
    clean(
      document.getElementById("description").value
    );


  /*
    कम से कम App / Website / UPI
  */

  if(
    !app_name &&
    !website_url &&
    !upi_id
  ){

    msg.className="red";

    msg.textContent =
      "⚠️ App Name, Website या UPI ID में से कम से कम एक भरें।";

    return;

  }


  /*
    Website URL validation
  */

  if(website_url){

    try{

      new URL(website_url);

    }catch(e){

      msg.className="red";

      msg.textContent =
        "⚠️ Website URL सही format में डालें। Example: https://example.com";

      return;

    }

  }


  /*
    Amount
  */

  let amount = null;

  if(amountValue){

    amount =
      Number(amountValue);

    if(
      !Number.isFinite(amount) ||
      amount < 0
    ){

      msg.className="red";

      msg.textContent =
        "⚠️ Amount सही डालें।";

      return;

    }

  }


  /*
    Data तैयार करना
  */

  const report = {

    app_name:
      app_name || null,

    scam_type:
      scam_type || null,

    website_url:
      website_url || null,

    upi_id:
      upi_id || null,

    amount:
      amount,

    description:
      description || null,

    status:
      "unverified"

  };


  console.log(
    "Submitting report:",
    report
  );


  try{

    const response =
      await fetch(
        base + "/rest/v1/scam_reports",
        {
          method:"POST",

          headers:{

            "apikey":key,

            "Authorization":
              "Bearer " + key,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"

          },

          body:
            JSON.stringify(report)

        }
      );


    const data =
      await response.json();


    console.log(
      "Supabase response:",
      data
    );


    if(!response.ok){

      throw new Error(
        JSON.stringify(data)
      );

    }


    /*
      Success
    */

    msg.className="green";

    msg.innerHTML =
      "✅ <b>Report successfully submit हो गई।</b><br>" +
      "Status: Unverified<br><br>" +
      "Admin verification के बाद यह report public checker में दिखाई देगी।";


    /*
      Form clear
    */

    document.getElementById(
      "app_name"
    ).value="";


    document.getElementById(
      "scam_type"
    ).value="";


    document.getElementById(
      "website_url"
    ).value="";


    document.getElementById(
      "upi_id"
    ).value="";


    document.getElementById(
      "amount"
    ).value="";


    document.getElementById(
      "description"
    ).value="";


  }catch(error){

    console.error(
      "Submit error:",
      error
    );


    msg.className="red";

    msg.innerHTML =
      "❌ <b>Report submit नहीं हुई।</b><br><br>" +
      clean(error.message);

  }

}

</script>

</body>
</html>
