<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <title>Report Scam - Scam Guard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f7fb;
      font-family: Arial, sans-serif;
      color: #111827;
    }

    .wrap {
      max-width: 700px;
      margin: 0 auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #111827;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #msg {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      line-height: 1.5;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    .info {
      display: block !important;
      background: #dbeafe;
      color: #1e40af;
    }

    .note {
      margin-top: 18px;
      padding: 12px;
      background: #f3f4f6;
      border-radius: 10px;
      color: #4b5563;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="wrap">

    <div class="card">

      <h1>🚨 Report a Scam</h1>

      <div class="subtitle">
        Scam Guard पर scam की जानकारी submit करें
      </div>

      <form id="reportForm">

        <label for="app_name">
          App Name
        </label>

        <input
          id="app_name"
          type="text"
          placeholder="Example: PhonePe"
        >


        <label for="scam_type">
          Scam Type
        </label>

        <select id="scam_type">

          <option value="">
            Select Scam Type
          </option>

          <option value="UPI Scam">
            UPI Scam
          </option>

          <option value="Website Scam">
            Website Scam
          </option>

          <option value="Payment Scam">
            Payment Scam
          </option>

          <option value="Investment Scam">
            Investment Scam
          </option>

          <option value="Job Scam">
            Job Scam
          </option>

          <option value="Shopping Scam">
            Shopping Scam
          </option>

          <option value="Other">
            Other
          </option>

        </select>


        <label for="website_url">
          Website URL
        </label>

        <input
          id="website_url"
          type="url"
          placeholder="https://example.com"
          autocomplete="url"
        >


        <label for="upi_id">
          UPI ID
        </label>

        <input
          id="upi_id"
          type="text"
          placeholder="example@upi"
        >


        <label for="amount">
          Amount
        </label>

        <input
          id="amount"
          type="number"
          placeholder="Example: 5000"
          min="0"
          step="0.01"
        >


        <label for="description">
          Description
        </label>

        <textarea
          id="description"
          placeholder="Scam के बारे में पूरी जानकारी लिखें..."
        ></textarea>


        <button
          id="submitBtn"
          type="submit"
        >
          📢 Submit Scam Report
        </button>

      </form>


      <div id="msg"></div>


      <div class="note">
        ⚠️ Report submit होने के बाद status
        <b>Unverified</b> रहेगा।
        Admin verification के बाद report public checker में दिखाई देगी।
      </div>

    </div>

  </div>


  <script>

    // ================================
    // SUPABASE CONFIG
    // ================================

    const base =
      "https://zdsvmqtfzprlfsggdepd.supabase.co";

    const key =
      "sb_publishable_ipHcSbMphfOBKG-ijTJDfQ_CSi-ZZZ4";


    // ================================
    // HELPER
    // ================================

    function clean(value) {
      return String(value || "").trim();
    }


    // ================================
    // FORM SUBMIT
    // ================================

    document
      .getElementById("reportForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();


        const msg =
          document.getElementById("msg");

        const submitBtn =
          document.getElementById("submitBtn");


        // ----------------------------
        // GET FORM VALUES
        // ----------------------------

        const app_name =
          clean(
            document.getElementById("app_name").value
          );


        const scam_type =
          clean(
            document.getElementById("scam_type").value
          );


        const website_url =
          clean(
            document.getElementById("website_url").value
          );


        // ============================
        // TEMPORARY DEBUG
        // ============================

        alert(
          "Captured URL = [" +
          website_url +
          "]"
        );


        const upi_id =
          clean(
            document.getElementById("upi_id").value
          );


        const amountValue =
          clean(
            document.getElementById("amount").value
          );


        const description =
          clean(
            document.getElementById("description").value
          );


        // ----------------------------
        // VALIDATION
        // ----------------------------

        if (
          !app_name &&
          !website_url &&
          !upi_id
        ) {

          msg.className = "error";

          msg.textContent =
            "❌ App Name, Website URL या UPI ID में से कम से कम एक भरें।";

          return;
        }


        // ----------------------------
        // WEBSITE URL VALIDATION
        // ----------------------------

        if (website_url) {

          try {

            new URL(website_url);

          } catch (error) {

            msg.className = "error";

            msg.textContent =
              "❌ कृपया सही Website URL डालें। Example: https://example.com";

            return;
          }

        }


        // ----------------------------
        // AMOUNT
        // ----------------------------

        let amount = null;

        if (amountValue !== "") {

          const numberAmount =
            Number(amountValue);

          if (
            Number.isNaN(numberAmount) ||
            numberAmount < 0
          ) {

            msg.className = "error";

            msg.textContent =
              "❌ कृपया सही Amount डालें।";

            return;
          }

          amount = numberAmount;
        }


        // ----------------------------
        // REPORT OBJECT
        // ----------------------------

        const report = {

  app_name:
    app_name || null,

  scam_type:
    scam_type || null,

  website_url:
    website_url || null,

  upi_id:
    upi_id || null,

  amount:
    amount,

  description:
    description || null,

  status:
    "unverified"
};
        };


        // ----------------------------
        // SHOW SUBMITTING
        // ----------------------------

        msg.className = "info";

        msg.textContent =
          "⏳ Report submit हो रही है...";

        submitBtn.disabled = true;


        try {

          // --------------------------
          // SEND TO SUPABASE
          // --------------------------

          const response =
            await fetch(
              base + "/rest/v1/scam_reports",
              {
                method: "POST",

                headers: {

                  "apikey": key,

                  "Authorization":
                    "Bearer " + key,

                  "Content-Type":
                    "application/json",

                  "Prefer":
                    "return=representation"
                },
 body:
  JSON.stringify(report)
              }
            );


          // --------------------------
          // ERROR
          // --------------------------

          if (!response.ok) {

            const errorText =
              await response.text();

            throw new Error(
              errorText ||
              "Supabase request failed"
            );
          }


          // --------------------------
          // SUCCESS
          // --------------------------

          const result =
            await response.json();

          console.log(
            "Supabase response:",
            result
          );


          msg.className = "success";

          msg.innerHTML =
            "✅ Report successfully submit हो गई.<br>" +
            "<b>Status:</b> Unverified<br>" +
            "Admin verification के बाद यह report public checker में दिखाई देगी.";


          // --------------------------
          // CLEAR FORM
          // --------------------------

          document
            .getElementById("app_name")
            .value = "";

          document
            .getElementById("scam_type")
            .value = "";

          document
            .getElementById("website_url")
            .value = "";

          document
            .getElementById("upi_id")
            .value = "";

          document
            .getElementById("amount")
            .value = "";

          document
            .getElementById("description")
            .value = "";


        } catch (error) {

          console.error(
            "Submit error:",
            error
          );


          msg.className = "error";

          msg.innerHTML =
            "❌ Report submit नहीं हो पाई।<br><br>" +
            "<b>Error:</b> " +
            error.message;

        } finally {

          submitBtn.disabled = false;

        }

      });

  </script>

</body>
</html>
