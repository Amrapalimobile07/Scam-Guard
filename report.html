<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Report Scam - Scam Guard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #173b75;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #173b75;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #888;
      cursor: not-allowed;
    }

    #msg {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      line-height: 1.5;
    }

    #msg.success {
      display: block;
      background: #e8f7e8;
      color: #176b17;
      border: 1px solid #9bd39b;
    }

    #msg.error {
      display: block;
      background: #ffeaea;
      color: #a00000;
      border: 1px solid #e0aaaa;
    }

    .note {
      margin-top: 8px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🛡️ Report a Scam</h1>

    <form id="reportForm" onsubmit="submitReport(event)">

      <label for="app_name">App Name</label>

      <input
        type="text"
        id="app_name"
        placeholder="उदा. PhonePe"
      >

      <label for="scam_type">Scam Type</label>

      <select id="scam_type">
        <option value="">Select Scam Type</option>
        <option value="UPI Scam">UPI Scam</option>
        <option value="Website Scam">Website Scam</option>
        <option value="Investment Scam">Investment Scam</option>
        <option value="Job Scam">Job Scam</option>
        <option value="Loan Scam">Loan Scam</option>
        <option value="Shopping Scam">Shopping Scam</option>
        <option value="Fake App">Fake App</option>
        <option value="Other">Other</option>
      </select>

      <label for="website_url">Website URL</label>

      <input
        type="url"
        id="website_url"
        placeholder="https://example.com"
      >

      <div class="note">
