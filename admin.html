<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scam Guard Admin</title>

<style>
body{margin:0;font-family:Arial;background:#f5f7fb;color:#111827}
.wrap{max-width:700px;margin:auto;padding:18px}
.card{background:white;padding:20px;border-radius:18px;margin-top:20px;box-shadow:0 2px 10px #0001}
input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:10px;margin-top:8px}
button{padding:12px 16px;border:0;border-radius:10px;background:#111827;color:white;font-weight:bold;margin-top:12px}
.report{border:1px solid #ddd;padding:15px;border-radius:12px;margin-top:12px}
.verify{background:#16803c}
.result{padding:12px;border-radius:10px;margin-top:12px}
</style>
</head>

<body>

<div class="wrap">

<div class="card">
<h1>🛡️ Scam Guard Admin</h1>

<p>Admin email से login करें।</p>

<input id="email" type="email" placeholder="Admin email">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">🔐 Login</button>

<div id="loginResult" class="result"></div>
</div>

<div id="panel" class="card" style="display:none">

<h2>📋 Unverified Reports</h2>

<button onclick="loadReports()">🔄 Refresh</button>

<div id="reports"></div>

</div>

</div>

<script>

const base = "https://zdsvmqtfzprlfsggdepd.supabase.co";

const key = "sb_publishable_ipHcSbMphfOBKG-ijTJDfQ_CSi-ZZZ4";

let accessToken = "";

async function login(){

const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;

const result = document.getElementById("loginResult");

if(!email || !password){

result.textContent="⚠️ Email और password डालें।";
return;

}

result.textContent="⏳ Login हो रहा है...";

try{

const response = await fetch(
base + "/auth/v1/token?grant_type=password",
{
method:"POST",
headers:{
"apikey":key,
"Content-Type":"application/json"
},
body:JSON.stringify({
email:email,
password:password
})
}
);

const data = await response.json();

if(!response.ok){

throw new Error(data.msg || data.message || "Login failed");

}

accessToken = data.access_token;

result.textContent="✅ Login सफल हुआ।";

document.getElementById("panel").style.display="block";

loadReports();

}catch(error){

result.textContent="❌ " + error.message;

}

}

async function loadReports(){

const reports = document.getElementById("reports");

reports.innerHTML="⏳ Reports loading...";

try{

const response = await fetch(
base +
"/rest/v1/scam_reports?select=*&status=eq.unverified&order=id.desc",
{
headers:{
"apikey":key,
"Authorization":"Bearer " + accessToken
}
}
);

const data = await response.json();

if(!response.ok){

throw new Error(JSON.stringify(data));

}

if(data.length===0){

reports.innerHTML="🟢 कोई unverified report नहीं है।";
return;

}

reports.innerHTML=data.map(x=>`

<div class="report">

<b>${x.app_name || "No App Name"}</b><br>

⚠️ ${x.scam_type || "No scam type"}<br>

💰 ${x.amount ? "₹"+x.amount : "Amount नहीं दिया"}<br>

🌐 ${x.website_url || "Website नहीं"}<br>

💳 ${x.upi_id || "UPI नहीं"}<br>

📝 ${x.description || ""}

<br>

<button class="verify" onclick="verifyReport('${x.id}')">
✅ Verify Report
</button>

</div>

`).join("");

}catch(error){

reports.innerHTML="❌ Error: " + error.message;

}

}

async function verifyReport(id){

if(!confirm("क्या इस report को VERIFIED करना है?")) return;

try{

const response = await fetch(
base + "/rest/v1/scam_reports?id=eq." + encodeURIComponent(id),
{
method:"PATCH",
headers:{
"apikey":key,
"Authorization":"Bearer " + accessToken,
"Content-Type":"application/json",
"Prefer":"return=minimal"
},
body:JSON.stringify({
status:"verified"
})
}
);

const text = await response.text();

if(!response.ok){

throw new Error(text);

}

alert("✅ Report VERIFIED हो गई!");

loadReports();

}catch(error){

alert("❌ Verify failed: " + error.message);

}

}

</script>

</body>
</html>
