<!doctype html>
<html lang="hi">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<meta name="theme-color"
content="#111827">

<title>Scam Guard Admin</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f5f7fb;
color:#111827;
}

.wrap{
max-width:700px;
margin:auto;
padding:18px;
}

.card{
background:white;
padding:20px;
border-radius:18px;
margin-top:20px;
box-shadow:0 2px 10px #0001;
}

input{
width:100%;
box-sizing:border-box;
padding:13px;
border:1px solid #ddd;
border-radius:10px;
margin-top:8px;
font-size:16px;
}

button{
padding:12px 16px;
border:0;
border-radius:10px;
background:#111827;
color:white;
font-weight:bold;
margin-top:12px;
cursor:pointer;
}

.verify{
background:#16803c;
}

.reject{
background:#b91c1c;
margin-left:6px;
}

.logout{
background:#6b7280;
}

.report{
border:1px solid #ddd;
padding:15px;
border-radius:12px;
margin-top:12px;
background:#fff;
}

.result{
padding:12px;
border-radius:10px;
margin-top:12px;
}

.green{
background:#dcf8df;
}

.red{
background:#ffe0e0;
}

.yellow{
background:#fff0b8;
}

.small{
font-size:13px;
color:#6b7280;
margin-top:8px;
}

</style>

</head>


<body>

<div class="wrap">


<!-- LOGIN -->

<div class="card"
id="loginBox">

<h1>🛡️ Scam Guard Admin</h1>

<p>
Admin email और password से login करें।
</p>

<input
id="email"
type="email"
placeholder="Admin email">

<input
id="password"
type="password"
placeholder="Password">

<button onclick="login()">
🔐 Login
</button>

<div
id="loginResult"
class="result">
</div>

</div>


<!-- ADMIN PANEL -->

<div
id="panel"
class="card"
style="display:none">

<h2>📋 Unverified Reports</h2>

<button onclick="loadReports()">
🔄 Refresh
</button>

<button
class="logout"
onclick="logout()">
🚪 Logout
</button>

<div
id="reports">
</div>

</div>


</div>


<script>


/* SUPABASE */

const base =
"https://zdsvmqtfzprlfsggdepd.supabase.co";

const key =
"sb_publishable_ipHcSbMphfOBKG-ijTJDfQ_CSi-ZZZ4";


let accessToken = "";


/* LOGIN */

async function login(){

const email =
document.getElementById("email")
.value.trim();

const password =
document.getElementById("password")
.value;

const result =
document.getElementById("loginResult");


if(!email || !password){

result.className =
"result yellow";

result.textContent =
"⚠️ Email और password डालें।";

return;

}


result.className =
"result yellow";

result.textContent =
"⏳ Login हो रहा है...";


try{


const response =
await fetch(

base +
"/auth/v1/token?grant_type=password",

{

method:"POST",

headers:{

"apikey":key,

"Content-Type":
"application/json"

},

body:JSON.stringify({

email:email,

password:password

})

}

);


const data =
await response.json();


if(!response.ok){

throw new Error(

data.msg ||
data.message ||
"Login failed"

);

}


accessToken =
data.access_token;


result.className =
"result green";

result.textContent =
"✅ Login सफल हुआ।";


document.getElementById(
"loginBox"
).style.display="none";


document.getElementById(
"panel"
).style.display="block";


loadReports();


}catch(error){


result.className =
"result red";

result.textContent =
"❌ " + error.message;

}

}


/* LOAD REPORTS */

async function loadReports(){

const reports =
document.getElementById(
"reports"
);


reports.innerHTML =
"⏳ Reports loading...";


try{


const response =
await fetch(

base +
"/rest/v1/scam_reports?select=*&status=eq.unverified",

{

method:"GET",

headers:{

"apikey":key,

"Authorization":
"Bearer " +
accessToken

}

}

);


const data =
await response.json();


if(!response.ok){

throw new Error(
JSON.stringify(data)
);

}


if(data.length===0){

reports.innerHTML =
"🟢 कोई unverified report नहीं है।";

return;

}


/* REPORT CARDS */

reports.innerHTML =
data.map(x => `

<div class="report">

<b>
${x.app_name || "No App Name"}
</b>

<br><br>

⚠️
${x.scam_type || "No scam type"}

<br>

💰
${x.amount ? "₹"+x.amount :
"Amount नहीं दिया"}

<br>

🌐
${x.website_url ||
"Website नहीं"}

<br>

💳
${x.upi_id ||
"UPI नहीं"}

<br>

📝
${x.description || ""}

<div class="small">

Status:
${x.status || "unknown"}

<br>

ID:
${x.id || "ID नहीं"}

</div>


<button
class="verify"
onclick="updateStatus('${x.id}','verified')">

✅ Verify

</button>


<button
class="reject"
onclick="updateStatus('${x.id}','rejected')">

❌ Reject

</button>


</div>

`).join("");


}catch(error){

reports.innerHTML =
"❌ Error: " +
error.message;

}

}


/* VERIFY / REJECT */

async function updateStatus(
id,
newStatus
){


const question =
newStatus === "verified"

? "क्या इस report को VERIFIED करना है?"

: "क्या इस report को REJECT करना है?";


if(!confirm(question))
return;


try{


const response =
await fetch(

base +
"/rest/v1/scam_reports?id=eq." +
encodeURIComponent(id),

{

method:"PATCH",

headers:{

"apikey":key,

"Authorization":
"Bearer " +
accessToken,

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

},

body:JSON.stringify({

status:newStatus

})

}

);


const text =
await response.text();


if(!response.ok){

throw new Error(text);

}


alert(

newStatus === "verified"

? "✅ Report VERIFIED हो गई!"

: "❌ Report REJECT हो गई!"

);


loadReports();


}catch(error){


alert(
"❌ Update failed: " +
error.message
);

}

}


/* LOGOUT */

function logout(){

accessToken="";

document.getElementById(
"panel"
).style.display="none";


document.getElementById(
"loginBox"
).style.display="block";


document.getElementById(
"password"
).value="";


document.getElementById(
"loginResult"
).textContent="";

}


</script>

</body>

</html>
