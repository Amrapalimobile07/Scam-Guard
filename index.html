<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Scam Guard</title>

<style>
body{margin:0;font-family:Arial;background:#f5f7fb;color:#111827}
.wrap{max-width:700px;margin:auto;padding:18px}
.hero{background:#111827;color:white;padding:28px 20px;border-radius:20px;text-align:center;margin-top:15px}
h1{font-size:34px}
input{width:100%;box-sizing:border-box;padding:14px;border:0;border-radius:10px;margin:12px 0;font-size:16px}
button{padding:13px 18px;border:0;border-radius:10px;background:white;color:#111827;font-weight:bold}
.result{margin-top:16px;padding:15px;border-radius:12px;display:none}
.red{background:#ffe0e0}
.yellow{background:#fff0b8}
.green{background:#dcf8df}
.card{background:white;padding:18px;border-radius:15px;margin-top:15px;box-shadow:0 2px 10px #0001}
</style>
</head>

<body>

<div class="wrap">

<div class="hero">
<div style="font-size:35px">🛡️</div>
<h1>Scam Guard</h1>

<p>पैसे भेजने से पहले App, Website या UPI check करें।</p>

<input id="q" placeholder="App / Website / UPI ID">

<button onclick="check()">🔍 Check Scam</button>

<div id="result" class="result"></div>
</div>

<div class="card">
<h2>📢 Report a Scam</h2>
<p>अगर आपको कोई suspicious App, Website या payment मिला है, तो report करें।</p>
<button onclick="location.href='scam_guard_v3_fixed.html'">
Report Scam
</button>
</div>

<div class="card">
<h2>🛡️ Safety Tips</h2>
<p>OTP, PIN और password किसी को न दें। Guaranteed profit के दावों से सावधान रहें।</p>
</div>

</div>

<script>

const base = "https://zdsvmqtfzprlfsggdepd.supabase.co";

const key = "sb_publishable_ipHcSbMphfOBKG-ijTJDfQ_CSi-ZZZ4";

const out = document.getElementById("result");

async function check(){

const q = document.getElementById("q").value.trim();

out.style.display = "block";

if(!q){
out.className = "result yellow";
out.textContent = "⚠️ App / Website / UPI ID डालें।";
return;
}

out.className = "result yellow";
out.textContent = "⏳ Database में checking...";

try{
const url =
base +
"/rest/v1/scam_reports?select=*&or=(" +
"app_name.ilike.*" + encodeURIComponent(q) + "*," +
"website_url.ilike.*" + encodeURIComponent(q) + "*," +
"upi_id.ilike.*" + encodeURIComponent(q) + "*" +
")";

const response = await fetch(url,{
method:"GET",
headers:{
"apikey":key,
"Authorization":"Bearer " + key
}
});

const data = await response.json();

if(!response.ok){
throw new Error(JSON.stringify(data));
}

if(data.length === 0){

out.className = "result green";
out.textContent = "🟢 No Report Found";
return;

}

const verified = data.some(x => x.status === "verified");

out.className = "result " + (verified ? "red" : "yellow");

out.innerHTML =
"<b>" +
(verified
? "🔴 VERIFIED SCAM REPORT"
: "🟡 UNVERIFIED REPORT") +
"</b><br><br>" +

data.map(x =>
"<b>" + (x.app_name || "") + "</b><br>" +
(x.scam_type || "") +
(x.amount ? "<br>Amount: ₹" + x.amount : "") +
(x.description ? "<br>" + x.description : "")
).join("<hr>");

}catch(error){

out.className = "result red";
out.textContent = "❌ Error: " + error.message;

}

}

</script>

</body>
</html>
